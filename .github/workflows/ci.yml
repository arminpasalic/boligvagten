name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install build pytest pytest-cov ruff
      - name: Lint
        run: ruff check .
      - name: Tests (offline — parsers run against recorded fixtures)
        run: pytest -q --cov=boligvagten --cov-report=term-missing
      - name: Build package
        run: python -m build
