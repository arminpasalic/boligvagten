name: Release

# Tag a version (git tag v1.2.3 && git push --tags) and this creates the
# GitHub release with the wheel, sdist and the double-click zip attached.
# Not published to PyPI yet: to add it, configure a trusted publisher on
# PyPI, then add `environment: pypi`, `id-token: write` and a
# pypa/gh-action-pypi-publish step.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release ref
        run: |
          python scripts/validate_release.py "$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit already contained in main."
            exit 1
          fi
      - name: Install verification tools
        run: pip install build pytest ruff
      - name: Lint and test
        run: |
          ruff check .
          pytest -q
      - name: Build sdist + wheel
        run: |
          python -m build
      - name: Build double-click download
        # Kept out of dist/, which a future PyPI upload would take whole.
        run: python scripts/build_bundle.py bundle
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/boligvagten-release-smoke
          /tmp/boligvagten-release-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          HOME=/tmp/boligvagten-release-home /tmp/boligvagten-release-smoke/bin/boligvagten --help
          /tmp/boligvagten-release-smoke/bin/python -c "from importlib import resources; assert resources.files('boligvagten').joinpath('web_ui.html').is_file()"
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            bundle/*.zip
          generate_release_notes: true
